# render.yaml (només Web Service GRATUÏT)
services:
  - type: web
    name: random-mcap-bot-web
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python random-mcap-telegram-bot.py"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_CHAT_ID
        sync: false